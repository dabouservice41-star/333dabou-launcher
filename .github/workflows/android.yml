name: Compiler APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Évite la tentative d'installation de l'ancien package « tools »,
          # qui n'est plus disponible dans les dépôts Android actuels.
          packages: |
            platform-tools

      - name: Installer les composants Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler et verifier
        run: gradle --no-daemon assembleDebug lintDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Dabou-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
